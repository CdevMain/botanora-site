# Botanora: botanora.cdev.com.br -> Node em 127.0.0.1:3010
# Instale em /etc/nginx/sites-available/ e crie o link em sites-enabled.
# Depois rode: certbot --nginx -d botanora.cdev.com.br (ele adiciona o bloco HTTPS).

upstream botanora_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name botanora.cdev.com.br;

    # Envio de PDFs pelo painel (o servidor aceita até 80 MB)
    client_max_body_size 90m;

    access_log /var/log/nginx/botanora.access.log;
    error_log  /var/log/nginx/botanora.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://botanora_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Arquivos estáticos: cache longo no navegador
    location /assets/ {
        proxy_pass http://botanora_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
